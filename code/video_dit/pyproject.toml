[project]
name = "video-dit-study"
version = "0.1.0"
description = "Mac-runnable educational Video DiT / Latte lab"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pillow>=9.0",
    "gradio>=4.0",
    "clip",
    "diffusers>=0.35,<0.38",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
temporal = [
    "transformers==4.57.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }
