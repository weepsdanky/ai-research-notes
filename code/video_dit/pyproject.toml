[project]
name = "video-dit-study"
version = "0.1.0"
description = "Mac-runnable educational Video DiT / Latte lab"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pillow>=9.0",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
